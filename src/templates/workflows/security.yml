# VECTOR required check: security  (webapp reference stack — /handover adapts; not universal)
name: security
on:
  pull_request:
    branches: [DEV]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanners
        run: pip install bandit pip-audit
      - name: bandit (Python SAST)
        run: bandit -r backend -q
      - name: pip-audit (dependency CVEs)
        run: pip-audit -r backend/requirements.txt
      # --- frontend: drop for the service-api profile ---
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend deps)
        run: npm --prefix frontend audit --audit-level=high
